name: kyushu-watch

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 한국/일본은 UTC+9 (동일 시간대).
    #
    # ① 매일 09:00 KST — 변화가 없어도 현재 표를 보내는 정기 리포트
    - cron: "0 2 * * *"
    # ② 평일 09:20~09:40 KST
    - cron: "20,40 0 * * 1-5"
    # ③ 평일 10:00~18:40 KST (20분 간격)
    - cron: "*/20 1-9 * * 1-5"
    #
    # 결과: 평일 09:00~18:40에만 20분 간격으로 확인,
    #       주말·야간·새벽에는 09:00 리포트 한 번만.
  workflow_dispatch:
    inputs:
      report:
        description: "변경이 없어도 현재 표를 알림으로 보내기"
        type: boolean
        default: false

# 동시 실행 방지 (state.json 커밋 충돌 방지)
concurrency:
  group: kyushu-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check JTA page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCH: 熊本県
          # 매일 09:00 KST 실행이거나, 수동 실행 시 report를 켰을 때만 정기 리포트
          FORCE_REPORT: ${{ github.event.schedule == '0 0 * * *' || inputs.report }}
        run: |
          if [ "$FORCE_REPORT" = "true" ]; then
            echo "정기 리포트 모드 (변화 없어도 발송)"
            python watch.py --report
          else
            python watch.py
          fi

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "kyushu-watch"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "변경 없음 - 커밋 생략"
          fi
