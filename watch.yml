name: kyushu-watch

on:
  schedule:
    # 20분마다 (UTC 기준. GitHub Actions cron은 수 분 지연될 수 있음)
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "변경이 없어도 현재 표를 알림으로 보내기"
        type: boolean
        default: false

# 동시 실행 방지 (state.json 커밋 충돌 방지)
concurrency:
  group: kyushu-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check JTA page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCH: 熊本県
        run: |
          python watch.py ${{ inputs.report && '--report' || '' }}

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "kyushu-watch"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "변경 없음 - 커밋 생략"
          fi
